    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #1a1614;
            --bg-gradient-start: #0d0b0a;
            --bg-gradient-end: #1a1614;
            --bg-card: #242220;
            --bg-card-hover: #2d2a27;
            --bg-card-item: #1e1c1a;
            --bg-header: #8b2e2e;
            --bg-header-end: #6b1e1e;
            --border-main: #4a3f35;
            --border-hover: #8b7355;
            --text-primary: #e8dfd0;
            --text-secondary: #b8a890;
            --text-title: #f5ead8;
            --text-accent: #d4a574;
            --text-link: #c9965f;
            --shadow: rgba(0,0,0,0.6);
            --accent-red: #c53030;
            --accent-gold: #d4af37;
        }

        [data-theme="light"] {
            --bg-main: #f5f0e8;
            --bg-gradient-start: #f5f0e8;
            --bg-gradient-end: #e8dfd0;
            --bg-card: #fff;
            --bg-card-hover: #f0ebe0;
            --bg-card-item: #fafaf8;
            --bg-header: #8b2e2e;
            --bg-header-end: #6b1e1e;
            --border-main: #bfa88e;
            --border-hover: #8b7355;
            --text-primary: #2c2416;
            --text-secondary: #5a4a3a;
            --text-title: #1a0f0f;
            --text-accent: #8b7355;
            --text-link: #6b5545;
            --shadow: rgba(0,0,0,0.1);
            --accent-red: #c53030;
            --accent-gold: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .page-background {
            background: linear-gradient(to bottom, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .page-background::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 46, 46, 0.03) 2px, rgba(139, 46, 46, 0.03) 4px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .search-container {
            background: var(--bg-card);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px var(--shadow);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.1em;
            border: 2px solid var(--border-main);
            border-radius: 6px;
            font-family: 'Crimson Pro', serif;
            background: var(--bg-card-item);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(197, 48, 48, 0.2);
            background: var(--bg-card);
        }

        .theme-toggle {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--bg-header) 0%, var(--bg-header-end) 100%);
            border: 2px solid var(--accent-red);
            border-radius: 6px;
            color: var(--text-title);
            font-family: 'Crimson Pro', serif;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(197, 48, 48, 0.4);
        }

        .page {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
        }

        .section-container {
            background: var(--bg-card);
            border: 2px solid var(--border-main);
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            overflow: hidden;
            transition: transform 0.3s;
        }

        .section-container:hover {
            transform: translateY(-2px);
        }

        .section-title {
            background: linear-gradient(135deg, var(--bg-header) 0%, var(--bg-header-end) 100%);
            border-bottom: 3px solid var(--accent-red);
            padding: 16px 20px;
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-title);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .float-right {
            float: right;
            font-size: 0.8em;
            font-weight: 600;
            opacity: 0.9;
        }

        .section-content {
            padding: 18px;
            max-height: 600px;
            overflow-y: auto;
        }

        .section-subtitle {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-main);
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px;
            background: var(--bg-card-item);
            border-left: 4px solid var(--accent-red);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item:hover {
            background: var(--bg-card-hover);
            border-left-color: var(--accent-gold);
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(139, 46, 46, 0.3);
        }

        .item-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            margin-right: 14px;
            background: linear-gradient(135deg, #8b2e2e 0%, #6b1e1e 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--accent-gold);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .item-text {
            flex: 1;
        }

        .item-title {
            font-weight: 700;
            color: var(--text-title);
            font-size: 1.1em;
            margin-bottom: 2px;
        }

        .item-desc {
            font-size: 0.95em;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-dialog {
            background: var(--bg-card);
            border: 3px solid var(--accent-red);
            border-radius: 10px;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--bg-header) 0%, var(--bg-header-end) 100%);
            border-bottom: 3px solid var(--accent-gold);
            padding: 20px 25px;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8em;
            font-weight: 700;
            color: var(--text-title);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .modal-body {
            padding: 30px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .weapon-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--bg-card-item);
            border-radius: 6px;
            border: 2px solid var(--border-main);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-value {
            font-weight: 700;
            color: var(--text-title);
            font-size: 1.15em;
        }

        .property-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid var(--border-main);
        }

        .property-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-size: 1.15em;
        }

        .property-desc {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .property-link {
            color: var(--text-link);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 700;
            transition: color 0.2s;
        }

        .property-link:hover {
            color: var(--accent-gold);
        }

        .weapon-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .weapon-link {
            padding: 8px 16px;
            background: var(--bg-card-item);
            border: 2px solid var(--border-main);
            border-radius: 6px;
            color: var(--text-link);
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .weapon-link:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-red);
            color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(139, 46, 46, 0.4);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .page {
                grid-template-columns: 1fr;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .theme-toggle {
                width: 100%;
            }
            
            .weapon-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
const html = document.documentElement;

const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeButton(savedTheme);

themeToggle.addEventListener('click', () => {
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeButton(newTheme);
});

function updateThemeButton(theme) {
    themeToggle.textContent = theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
}

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const sectionsContainer = document.getElementById('sections');
const searchBox = document.getElementById('searchBox');

// Create lookup maps
const weaponMap = {};
weaponsData.weapons.forEach(w => {
    weaponMap[w.name.toLowerCase()] = w;
});

// Icon mapping for weapons
function getWeaponIcon(weapon) {
    const name = weapon.name.toLowerCase();
    
    if (name.includes('sword')) return '⚔';
    if (name.includes('axe')) return '⚏';
    if (name.includes('bow')) return '⇢';
    if (name.includes('crossbow')) return '◈';
    if (name.includes('dagger')) return '◇';
    if (name.includes('hammer') || name.includes('mace') || name.includes('club') || name.includes('maul')) return '▣';
    if (name.includes('spear') || name.includes('javelin') || name.includes('trident') || name.includes('pike')) return '⚑';
    if (name.includes('staff')) return '┃';
    if (name.includes('whip')) return '≋';
    if (name.includes('sling') || name.includes('dart')) return '◎';
    if (name.includes('gun') || name.includes('pistol') || name.includes('musket')) return '◉';
    if (name.includes('flail')) return '⊛';
    
    if (weapon.category && weapon.category.includes('ranged')) return '⇢';
    return '⚔';
}

function getMasteryIcon(mastery) {
    const icons = {
        'Cleave': '⚔',
        'Graze': '◈',
        'Nick': '◇',
        'Push': '◎',
        'Sap': '▼',
        'Slow': '◐',
        'Topple': '▬',
        'Vex': '✦'
    };
    return icons[mastery] || '◆';
}

function getPropertyIcon(property) {
    const icons = {
        'Ammunition': '⇢',
        'Finesse': '◇',
        'Heavy': '▣',
        'Light': '◌',
        'Loading': '◎',
        'Range': '⇢',
        'Reach': '⚑',
        'Thrown': '◈',
        'Two-Handed': '▬',
        'Versatile': '◆'
    };
    return icons[property] || '◆';
}

function getCategoryName(category) {
    const names = {
        'simple_melee': 'Simple Melee',
        'simple_ranged': 'Simple Ranged',
        'martial_melee': 'Martial Melee',
        'martial_ranged': 'Martial Ranged'
    };
    return names[category] || category;
}

function parseProperties(propertiesStr) {
    if (propertiesStr === '—') return [];
    
    const props = [];
    const parts = propertiesStr.split(',').map(p => p.trim());
    
    parts.forEach(part => {
        if (part.includes('Ammunition')) props.push('Ammunition');
        else if (part.includes('Finesse')) props.push('Finesse');
        else if (part.includes('Heavy')) props.push('Heavy');
        else if (part.includes('Light')) props.push('Light');
        else if (part.includes('Loading')) props.push('Loading');
        else if (part.includes('Reach')) props.push('Reach');
        else if (part.includes('Thrown')) props.push('Thrown');
        else if (part.includes('Two-Handed')) props.push('Two-Handed');
        else if (part.includes('Versatile')) props.push('Versatile');
    });
    
    return props;
}

function openWeapon(weapon) {
    modalTitle.textContent = weapon.name;
    
    const properties = parseProperties(weapon.properties);
    
    let bodyHTML = `
        <div class="weapon-stats">
            <div class="stat-item">
                <div class="stat-label">Damage</div>
                <div class="stat-value">${weapon.damage}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Mastery</div>
                <div class="stat-value"><span class="property-link" data-mastery="${weapon.mastery}">${weapon.mastery}</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Weight</div>
                <div class="stat-value">${weapon.weight}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Cost</div>
                <div class="stat-value">${weapon.cost}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Category</div>
                <div class="stat-value">${getCategoryName(weapon.category)}</div>
            </div>
        </div>
    `;
    
    if (properties.length > 0 || weapon.properties !== '—') {
        bodyHTML += '<div class="property-section">';
        bodyHTML += '<div class="property-title">Properties</div>';
        
        // Show properties as clickable badges
        if (properties.length > 0) {
            bodyHTML += '<div class="weapon-links">';
            properties.forEach(prop => {
                bodyHTML += `<span class="weapon-link" data-property="${prop}">${prop}</span>`;
            });
            bodyHTML += '</div>';
            bodyHTML += '<div class="property-desc" style="margin-top: 10px;">' + weapon.properties + '</div>';
        } else {
            bodyHTML += '<div class="property-desc">' + weapon.properties + '</div>';
        }
        
        bodyHTML += '</div>';
    }
    
    if (weaponsData.mastery[weapon.mastery]) {
        bodyHTML += '<div class="property-section">';
        bodyHTML += '<div class="property-title">Mastery Property</div>';
        bodyHTML += `
            <div class="property-desc">
                <strong>${weapon.mastery}:</strong> ${weaponsData.mastery[weapon.mastery]}
            </div>
        `;
        bodyHTML += '</div>';
    }
    
    modalBody.innerHTML = bodyHTML;
    
    // Add click handlers for property badges
    modalBody.querySelectorAll('.weapon-link[data-property]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const prop = link.dataset.property;
            openProperty(prop);
        });
    });
    
    // Add click handlers for mastery link
    modalBody.querySelectorAll('.property-link[data-mastery]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const mastery = link.dataset.mastery;
            openMastery(mastery);
        });
    });
    
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
}

function openProperty(propertyName) {
    modalTitle.textContent = propertyName;
    
    const propertyEntry = weaponsData.property_entries.find(p => p.name === propertyName);
    
    let bodyHTML = '<div class="property-section">';
    bodyHTML += `<div class="property-desc"><strong>${propertyName}:</strong> ${weaponsData.properties[propertyName]}</div>`;
    
    if (propertyEntry && propertyEntry.weapons.length > 0) {
        bodyHTML += '<div class="property-title" style="margin-top: 20px;">Weapons with this Property:</div>';
        bodyHTML += '<div class="weapon-links">';
        propertyEntry.weapons.forEach(weaponName => {
            bodyHTML += `<span class="weapon-link" data-weapon="${weaponName}">${weaponName}</span>`;
        });
        bodyHTML += '</div>';
    }
    
    bodyHTML += '</div>';
    
    modalBody.innerHTML = bodyHTML;
    
    modalBody.querySelectorAll('.weapon-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const weaponName = link.dataset.weapon;
            const weapon = weaponMap[weaponName.toLowerCase()];
            if (weapon) {
                openWeapon(weapon);
            }
        });
    });
    
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
}

function openMastery(masteryName) {
    modalTitle.textContent = masteryName + ' Mastery';
    
    const masteryEntry = weaponsData.mastery_entries.find(m => m.name === masteryName);
    
    let bodyHTML = '<div class="property-section">';
    bodyHTML += `<div class="property-desc"><strong>${masteryName}:</strong> ${weaponsData.mastery[masteryName]}</div>`;
    
    if (masteryEntry && masteryEntry.weapons.length > 0) {
        bodyHTML += '<div class="property-title" style="margin-top: 20px;">Weapons with this Mastery:</div>';

        masteryEntry.weapons.forEach(weaponName => {
            bodyHTML += `<span class="weapon-link" data-weapon="${weaponName}">${weaponName}</span>`;
        });

    }
    
    bodyHTML += '</div>';
    
    modalBody.innerHTML = bodyHTML;
    
    modalBody.querySelectorAll('.weapon-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const weaponName = link.dataset.weapon;
            const weapon = weaponMap[weaponName.toLowerCase()];
            if (weapon) {
                openWeapon(weapon);
            }
        });
    });
    
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';

function closeModal() {
    modal.classList.remove('show');
    document.body.style.overflow = 'auto';
}

modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        closeModal();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

let allItems = [];

function performSearch(query) {
    const lowerQuery = query.toLowerCase();
    
    if (!query) {
        allItems.forEach(item => item.element.classList.remove('hidden'));
        document.querySelectorAll('.section-container').forEach(s => s.classList.remove('hidden'));
        return;
    }
    
    allItems.forEach(item => item.element.classList.add('hidden'));
    
    const matchingItems = allItems.filter(item => {
        if (item.searchText) {
            return item.searchText.toLowerCase().includes(lowerQuery);
        }
        return false;
    });
    
    matchingItems.forEach(item => item.element.classList.remove('hidden'));
    
    document.querySelectorAll('.section-container').forEach(section => {
        const hasVisibleItems = section.querySelectorAll('.item:not(.hidden)').length > 0;
        if (hasVisibleItems) {
            section.classList.remove('hidden');
        } else {
            section.classList.add('hidden');
        }
    });
}

searchBox.addEventListener('input', (e) => {
    performSearch(e.target.value);
});

function renderSections() {
    const sections = [
        { key: 'simple_melee', title: 'Simple Melee Weapons', subtitle: 'Basic weapons for close combat' },
        { key: 'simple_ranged', title: 'Simple Ranged Weapons', subtitle: 'Basic weapons for ranged attacks' },
        { key: 'martial_melee', title: 'Martial Melee Weapons', subtitle: 'Advanced weapons for close combat' },
        { key: 'martial_ranged', title: 'Martial Ranged Weapons', subtitle: 'Advanced weapons for ranged attacks' },
        { key: 'mastery', title: 'Mastery Properties', subtitle: 'Special weapon techniques' },
        { key: 'properties', title: 'Weapon Properties', subtitle: 'Weapon characteristics and rules' }
    ];

    allItems = [];
    
    const categorizedWeapons = {};
    sections.forEach(section => {
        if (section.key === 'mastery') {
            categorizedWeapons[section.key] = weaponsData.mastery_entries;
        } else if (section.key === 'properties') {
            categorizedWeapons[section.key] = weaponsData.property_entries;
        } else {
            categorizedWeapons[section.key] = weaponsData.weapons.filter(w => w.category === section.key);
        }
    });
    
    sectionsContainer.innerHTML = sections.map(section => {
        const items = categorizedWeapons[section.key] || [];
        if (items.length === 0) return '';

        let itemsHTML = '';
        
        if (section.key === 'mastery') {
            itemsHTML = items.map((mastery, idx) => {
                const itemId = `item-mastery-${idx}`;
                return `
                    <div class="item" id="${itemId}" data-type="mastery" data-index="${idx}">
                        <div class="item-icon">${getMasteryIcon(mastery.name)}</div>
                        <div class="item-text">
                            <div class="item-title">${mastery.name}</div>
                            <div class="item-desc">${mastery.weapons.length} weapons</div>
                        </div>
                    </div>
                `;
            }).join('');
        } else if (section.key === 'properties') {
            itemsHTML = items.map((property, idx) => {
                const itemId = `item-property-${idx}`;
                return `
                    <div class="item" id="${itemId}" data-type="property" data-index="${idx}">
                        <div class="item-icon">${getPropertyIcon(property.name)}</div>
                        <div class="item-text">
                            <div class="item-title">${property.name}</div>
                            <div class="item-desc">${property.weapons.length} weapons</div>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            itemsHTML = items.map((weapon, idx) => {
                const itemId = `item-${section.key}-${idx}`;
                return `
                    <div class="item" id="${itemId}" data-type="weapon" data-category="${section.key}" data-index="${idx}">
                        <div class="item-icon">${getWeaponIcon(weapon)}</div>
                        <div class="item-text">
                            <div class="item-title">${weapon.name}</div>
                            <div class="item-desc">${weapon.damage} • ${weapon.mastery}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        return `
            <div class="section-container">
                <div class="section-title">
                    ${section.title} <span class="float-right">${items.length}</span>
                </div>
                <div class="section-content">
                    <div class="section-subtitle">${section.subtitle}</div>
                    ${itemsHTML}
                </div>
            </div>
        `;
    }).join('');
    
    document.querySelectorAll('.item').forEach(itemEl => {
        const type = itemEl.dataset.type;
        const index = parseInt(itemEl.dataset.index);
        
        if (type === 'weapon') {
            const category = itemEl.dataset.category;
            const weapon = categorizedWeapons[category][index];
            
            itemEl.addEventListener('click', () => openWeapon(weapon));
            
            allItems.push({
                element: itemEl,
                searchText: `${weapon.name} ${weapon.damage} ${weapon.properties} ${weapon.mastery}`
            });
        } else if (type === 'mastery') {
            const mastery = categorizedWeapons['mastery'][index];
            
            itemEl.addEventListener('click', () => openMastery(mastery.name));
            
            allItems.push({
                element: itemEl,
                searchText: `${mastery.name} ${mastery.description} ${mastery.weapons.join(' ')}`
            });
        } else if (type === 'property') {
            const property = categorizedWeapons['properties'][index];
            
            itemEl.addEventListener('click', () => openProperty(property.name));
            
            allItems.push({
                element: itemEl,
                searchText: `${property.name} ${property.description} ${property.weapons.join(' ')}`
            });
        }
    });
}

renderSections();
</script></body></html>
